<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thank You | Chizix Orbit Digital Innovations LTD</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --purple:#4A1A7C;
    --purple-light:#F4EEF9;
    --red:#CC1133;
    --white:#ffffff;
    --text:#333333;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'DM Sans',sans-serif;
    background:linear-gradient(135deg,#4A1A7C,#6B2FA0);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card{
    background:#fff;
    max-width:650px;
    width:100%;
    border-radius:18px;
    padding:60px 45px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.18);
}

.icon{
    width:90px;
    height:90px;
    background:#16a34a;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 30px;
    color:#fff;
    font-size:42px;
}

h1{
    font-family:'Cormorant Garamond',serif;
    color:var(--purple);
    font-size:48px;
    margin-bottom:15px;
}

p{
    color:#555;
    font-size:17px;
    line-height:1.8;
    margin-bottom:15px;
}

.company{
    color:var(--red);
    font-weight:700;
}

.btn{
    display:inline-block;
    margin-top:30px;
    background:var(--purple);
    color:#fff;
    text-decoration:none;
    padding:15px 38px;
    border-radius:8px;
    font-weight:600;
    transition:.3s;
}

.btn:hover{
    background:#5f2696;
}

</style>

</head>

<body>

<div class="card">

<div class="icon">✓</div>

<h1>Thank You!</h1>

<p>
Your message has been received successfully.
</p>

<p>
Thank you for contacting
<span class="company">Chizix Orbit Digital Innovations LTD.</span>
</p>

<p>
Our team will review your enquiry and get back to you as soon as possible.
</p>

<a href="index.html" class="btn">
Return to Home
</a>

</div>

</body>
</html>
