<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CHIZIX ORBIT DIGITAL INNOVATIONS LTD — Beyond Limits</title>
<link href="https://googleapis.com" rel="stylesheet"/>
<style>
  :root {
    --white: #FFFFFF;
    --purple: #4A1A7C;
    --purple-mid: #6B2FA0;
    --purple-light: #F3EEF9;
    --purple-border: #C9A8E8;
    --black: #1A1020;
    --black-soft: #2E1E40;
    --red: #CC1133;
    --font-display: 'Cormorant Garamond', serif;
    --font-body: 'DM Sans', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: var(--font-body); background: var(--white); color: var(--black); overflow-x: hidden; }

  /* NAV */
  nav {
    position: sticky; top: 0; z-index: 100;
    background: var(--white);
    border-bottom: 1.5px solid var(--purple-border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 40px; height: 76px;
    box-shadow: 0 2px 16px rgba(74,26,124,0.07);
  }
  .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .nav-logo img { width: 58px; height: 58px; object-fit: contain; flex-shrink: 0; }
  .nav-logo-text { display: flex; flex-direction: column; line-height: 1.15; }
  .nav-logo-text .name {
    font-family: var(--font-display); font-size: 14px; font-weight: 700;
    color: var(--purple); letter-spacing: 1px; text-transform: uppercase;
  }
  .nav-logo-text .slogan {
    font-size: 10px; font-weight: 600; color: var(--red);
    letter-spacing: 3px; text-transform: uppercase;
  }
  .nav-links { display: flex; align-items: center; gap: 32px; }
  .nav-links a {
    font-size: 14px; font-weight: 500; color: var(--black-soft);
    text-decoration: none; letter-spacing: 0.5px;
    position: relative; padding-bottom: 2px; transition: color 0.2s;
  }
  .nav-links a::after {
    content: ''; position: absolute; bottom: 0; left: 0;
    width: 0; height: 1.5px; background: var(--red); transition: width 0.25s;
  }
  .nav-links a:hover { color: var(--purple); }
  .nav-links a:hover::after { width: 100%; }
  .nav-cta {
    background: var(--purple); color: var(--white) !important;
    padding: 9px 22px; border-radius: 4px;
    font-weight: 600 !important; letter-spacing: 1px !important;
  }
  .nav-cta::after { display: none !important; }
  .nav-cta:hover { background: var(--purple-mid) !important; }

  /* HERO */
  .hero {
    background: var(--purple); min-height: 88vh;
    display: flex; align-items: center;
    position: relative; overflow: hidden; padding: 80px 40px;
  }
  .hero-bg-circles { position: absolute; inset: 0; pointer-events: none; }
  .hero-bg-circles circle { opacity: 0.06; }
  .hero-inner {
    max-width: 1100px; margin: 0 auto;
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 60px; align-items: center; position: relative; z-index: 1;
  }
  .hero-text h1 {
    font-family: var(--font-display);
    font-size: clamp(42px, 6vw, 78px);
    font-weight: 700; line-height: 1.05; color: var(--white); margin-bottom: 10px;
  }
  .hero-text .slogan-tag {
    display: inline-block; font-size: 12px; font-weight: 600;
    letter-spacing: 5px; text-transform: uppercase;
    color: var(--red); margin-bottom: 24px;
  }
  .hero-text p {
    font-size: 17px; line-height: 1.75;
    color: rgba(255,255,255,0.78); max-width: 480px; margin-bottom: 36px;
  }
  .hero-btns { display: flex; gap: 16px; flex-wrap: wrap; }
  .btn-primary {
    background: var(--red); color: var(--white);
    padding: 14px 32px; border-radius: 4px;
    font-size: 14px; font-weight: 600; letter-spacing: 1px;
    text-decoration: none; text-transform: uppercase;
    transition: background 0.2s, transform 0.15s; display: inline-block;
  }
  .btn-primary:hover { background: #a80d28; transform: translateY(-1px); }
  .btn-outline {
    background: transparent; color: var(--white);
    padding: 13px 32px; border-radius: 4px;
    border: 1.5px solid rgba(255,255,255,0.4);
    font-size: 14px; font-weight: 500; text-decoration: none;
    transition: border-color 0.2s, background 0.2s; display: inline-block;
  }
  .btn-outline:hover { border-color: var(--white); background: rgba(255,255,255,0.07); }
  .hero-logo-large { display: flex; justify-content: center; align-items: center; }
  .hero-logo-large img { width: 100%; max-width: 340px; height: auto; filter: drop-shadow(0 8px 32px rgba(0,0,0,0.35)); }

  /* SECTIONS */
  section { padding: 90px 40px; }
  .section-inner { max-width: 1100px; margin: 0 auto; }
  .section-label {
    font-size: 11px; font-weight: 600; letter-spacing: 5px;
    text-transform: uppercase; color: var(--red); margin-bottom: 12px; display: block;
  }
  .section-title {
    font-family: var(--font-display); font-size: clamp(32px, 4vw, 52px);
    font-weight: 700; line-height: 1.1; color: var(--purple); margin-bottom: 16px;
  }
  .section-sub {
    font-size: 16px; color: #5a4570; line-height: 1.7;
    max-width: 560px; margin-bottom: 56px;
  }

  /* --- SWIPEABLE CAROUSEL SYSTEM --- */
  .carousel-container {
    width: 100%;
    overflow-x: auto;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    padding: 20px 0;
  }
  .carousel-container::-webkit-scrollbar { display: none; }
  .carousel-container { -ms-overflow-style: none; scrollbar-width: none; }

  .carousel-track {
    display: flex;
    gap: 24px;
    padding: 0 10px;
  }

  .service-card {
    flex: 0 0 290px; /* Forces cards side-by-side to allow horizontal swiping */
    background: var(--white); border: 1.5px solid var(--purple-border);
    border-radius: 8px; padding: 32px 28px;
    transition: box-shadow 0.25s, transform 0.2s, border-color 0.2s;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .service-card::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 4px; height: 100%; background: var(--purple); transition: background 0.2s;
  }
  .service-card:hover { box-shadow: 0 8px 32px rgba(74,26,124,0.13); transform: translateY(-3px); border-color: var(--purple); }
  .service-card:hover::before { background: var(--red); }
  .service-num {
    position: absolute; top: 20px; right: 22px;
    font-family: var(--font-display); font-size: 42px; font-weight: 700;
    color: var(--purple-light); line-height: 1;
  }
  .service-card h3 { font-family: var(--font-display); font-size: 21px; font-weight: 700; color: var(--purple); margin-bottom: 10px; }
  .service-card p { font-size: 14px; color: #5a4570; line-height: 1.7; margin-bottom: 14px; }
  .service-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .service-list li { font-size: 13px; color: var(--black-soft); padding-left: 16px; position: relative; line-height: 1.5; }
  .service-list li::before { content: ''; position: absolute; left: 0; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--red); }

  /* WHY US */
  #why { background: var(--purple-light); }
  .why-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; margin-top: 40px; }
  .why-card { background: var(--white); border-radius: 8px; padding: 28px 24px; border: 1px solid var(--purple-border); text-align: center; }
  .why-card .big { font-family: var(--font-display); font-size: 44px; font-weight: 700; color: var(--purple); line-height: 1; margin-bottom: 8px; }
  .why-card p { font-size: 14px; color: #5a4570; line-height: 1.6; }

  /* CTA BAND */
  .cta-band { background: var(--purple); padding: 70px 40px; text-align: center; }
  .cta-band h2 { font-family: var(--font-display); font-size: clamp(28px, 4vw, 52px); font-weight: 700; color: var(--white); margin-bottom: 16px; }
  .cta-band p { font-size: 16px; color: rgba(255,255,255,0.75); max-width: 520px; margin: 0 auto 36px; line-height: 1.7; }
  .cta-band .btn-primary { font-size: 15px; padding: 16px 40px; }

  /* CONTACT FORM SECTION */
  #contact { background: var(--white); padding: 90px 40px; }
  .contact-container { max-width: 600px; margin: 0 auto; background: var(--purple-light); padding: 40px; border-radius: 12px; border: 1.5px solid var(--purple-border); }
  .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
  .form-group label { font-size: 14px; font-weight: 600; color: var(--purple); }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1.5px solid var(--purple-border); border-radius: 6px; font-family: var(--font-body); font-size: 14px; }
  .form-group textarea { height: 120px; resize: none; }
  .form-submit-btn { background: var(--purple); color: var(--white); border: none; padding: 14px; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
  .form-submit-btn:hover { background: var(--purple-mid); }

  /* CORPORATE FOOTER */
  .corporate-footer {
    background-color: var(--black);
    color: rgba(255,255,255,0.7);
    padding: 60px 40px 30px;
    border-top: 2px solid var(--purple-border);
    font-size: 14px;
    line-height: 1.8;
  }
  .footer-inner {
    max-width: 1100px; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 20px;
  }
  .footer-branding { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .footer-brand-logo { width: 70px; height: auto; object-fit: contain; }
  .footer-brand-title { font-family: var(--font-display); font-size: 18px; color: var(--white); letter-spacing: 1px; font-weight: 700; }
  .footer-legal { border-top: 1px solid rgba(255,255,255,0.1); width: 100%; padding-top: 20px; margin-top: 10px; font-size: 13px; }
